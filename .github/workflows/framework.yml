name: framework

on:
  push:
    paths: ['framework/**', 'theory/**', '.github/workflows/framework.yml']
  pull_request:
    paths: ['framework/**', 'theory/**', '.github/workflows/framework.yml']

jobs:
  plunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - run: swipl -g run_tests -t halt framework/test/*.pl theory/test/*.pl
